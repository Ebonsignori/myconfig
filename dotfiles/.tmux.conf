# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# switch panes vim-style with prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with prefix + Shift-hjkl (repeatable: hold prefix once, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Remap 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# snappier ESC + truecolor (helps Claude Code syntax highlighting)
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*256col*:Tc"

# Reload tmux config 
bind r source-file ~/.tmux.conf

set status on

# Theme
# source-file "${MY_CONFIG_DIR}/.tmux-themepack/basic.tmuxtheme"

